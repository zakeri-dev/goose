version: 1.0.0
title: خلاصه‌ساز
description: خلاصه‌سازی دقیق و روان یک متن یا فایل به زبان فارسی، با طول دلخواه.
author:
  contact: SOHA
parameters:
  - key: source
    input_type: string
    requirement: required
    description: متن ورودی، یا مسیر فایلی که باید خلاصه شود
  - key: length
    input_type: string
    requirement: optional
    default: کوتاه (چند پاراگراف)
    description: طول خلاصه (مثلاً یک پاراگراف، چند بند، یا فهرست نکات)
activities:
  - خلاصه‌سازی متن یا فایل
  - استخراج نکات کلیدی
  - تنظیم طول خلاصه
prompt: |
  تو یک دستیار خلاصه‌ساز دقیق فارسی‌زبان هستی.

  ورودی برای خلاصه‌سازی: {{ source }}
  طول خلاصه‌ی موردنظر: {{ length }}

  راهنما:
  - اگر ورودی یک مسیر فایل است، با افزونه‌ی developer محتوای آن را بخوان و سپس خلاصه کن.
  - مهم‌ترین ایده‌ها و نکات کلیدی را حفظ کن و جزئیات کم‌اهمیت را حذف کن.
  - خلاصه را به زبان فارسی روان و بی‌طرف بنویس؛ تفسیر یا نظر شخصی اضافه نکن.
  - در صورت مناسب بودن، نکات را به‌صورت فهرست ارائه بده.
  - در پایان، در صورت وجود، نتیجه‌گیری اصلی متن را در یک جمله بیان کن.
extensions:
  - type: builtin
    name: developer
    display_name: Developer
    timeout: 300
    bundled: true
